baseURL: https://als0n.github.io/MyWebPage/
title: What we make for ourselves
locale: en-AU
defaultContentLanguage: en
theme: no-fate
copyright: What we make for ourselves
enableRobotsTXT: true

pagination:
  pagerSize: 12

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  topic: topics
  category: categories

menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
      params:
        secondary: study logs
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
      params:
        secondary: code, experiments
    - identifier: about
      name: About
      url: /about/
      weight: 50
      params:
        secondary: profile, contact
    - identifier: search
      name: Search
      url: /search/
      weight: 60

params:
  author: The Night Shift Committee
  description: Notes on tools, rituals, records, and the beautiful trouble of doing it ourselves.
  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true
  mainSections:
    - questions
    - notes
    - archives
    - projects
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  hideAuthor: true
  footer:
    hideCopyright: true
    hidePoweredBy: true
    text: "Made with [No Fate](https://github.com/OliverObst/no-fate) by [Oliver Obst](https://oliver.obst.eu/) and [Hugo](https://gohugo.io/)."
  label:
    text: "MY 2026 WORKBOOK"
  noFate:
    style: wild
    defaultMode: editorial
    defaultAccent: signal
    showThemeToggle: true
    showSearch: true
    showReadingTime: true
    showPropositions: true
    enableImageProcessing: true
    validateContentModel: true
    strictHomeSelections: false
    wild:
      masthead: "컴퓨터인공지능학과 손민후"
      issue: "2026 Portfolio"
    home:
      featuredProposition: example-maintenance-is-design
    archive:
      showArtefactNumbers: true
      showRights: true
    images:
      widths:
        - 480
        - 800
        - 1200
        - 1600
      webpQuality: 82
    record:
      dataFile: record
      enableClientFilters: true
      selectedGroupBy: collection
      filterFields:
        - year
        - type
        - topic
      highlightCreators:
        - Iona Bramble
      showAbstracts: false

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
        enable: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    renderer:
      unsafe: false
